<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bottom Sheet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button class="open-btn" id="openBtn">Open Bottom Sheet</button>

    <div class="backdrop" id="backdrop"></div>

    <div class="sheet" id="sheet">
      <div class="handle" id="handle"></div>
      <h2>Share Options</h2>
      <div class="sub">Choose how you'd like to share this</div>

      <div class="option-list">
        <div class="option">
          <div class="emoji">🔗</div>
          <div class="text">
            <div class="name">Copy Link</div>
            <div class="desc">Copy a shareable URL to clipboard</div>
          </div>
        </div>
        <div class="option">
          <div class="emoji">💬</div>
          <div class="text">
            <div class="name">Send Message</div>
            <div class="desc">Share directly via chat</div>
          </div>
        </div>
        <div class="option">
          <div class="emoji">📧</div>
          <div class="text">
            <div class="name">Email</div>
            <div class="desc">Send as an email attachment</div>
          </div>
        </div>
      </div>

      <button class="close-btn" id="closeBtn">Cancel</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
