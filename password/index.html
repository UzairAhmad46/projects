<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Show/Hide — Uzair WebCraft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1>Create Password</h1>
      <p class="sub">Click the eye icon to toggle visibility</p>
      <label for="pwd">Password</label>
      <div class="field">
        <input type="password" id="pwd" placeholder="Enter your password" />
        <button
          type="button"
          class="toggle-btn"
          id="toggleBtn"
          aria-label="Show password"
        >
          <span class="eye">👁️</span>
          <span class="eye-off">🙈</span>
        </button>
      </div>
      <div class="hint">Min 8 characters, 1 number, 1 symbol</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
