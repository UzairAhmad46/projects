<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System — Pure CSS Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="title">The Solar System</div>
    <div class="solar-system">
      <div class="sun"></div>

      <!-- orbit one -->

      <div class="orbit o1"></div>
      <div class="planet-wrap w1">
        <div class="planet p1"></div>
        <div class="label">Mercury</div>
      </div>

      <!-- orbit two -->

      <div class="orbit o2"></div>
      <div class="planet-wrap w2">
        <div class="planet p2"></div>
        <div class="label">Venus</div>
      </div>

      <!-- orbit three -->

      <div class="orbit o3"></div>
      <div class="planet-wrap w3">
        <div class="planet p3"></div>
        <div class="label">Earth</div>
      </div>
      <!-- orbit four -->

      <div class="orbit o4"></div>
      <div class="planet-wrap w4">
        <div class="planet p3"></div>
        <div class="label">Mars</div>
      </div>

      <!-- orbit five -->

      <div class="orbit o5"></div>
      <div class="planet-wrap w5">
        <div class="planet p5"></div>
        <div class="label">Jupiter</div>
      </div>
      <!-- orbit six -->

      <div class="orbit o6"></div>
      <div class="planet-wrap w6">
        <div class="planet p6">
          <div class="ring"></div>
        </div>
        <div class="label">Saturn</div>
      </div>
    </div>

    <footer>
      Pure CSS ---- no JS, no libraries. <span>Uzair WebCraft</span>
    </footer>
  </body>
</html>
