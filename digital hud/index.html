<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital HUD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <div class="hud">
        <div class="scanline"></div>

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="top-bar">
          <span class="logo">NEXUS // OS</span>
          <span><span class="live-dot"></span>LIVE FEED</span>
          <span id="clock">00:00:00</span>
        </div>

        <div class="reticle">
          <svg viewBox="0 0 120 120">
            <circle class="ring-outer ring-tick" cx="60" cy="60" r="52" />
            <circle cx="60" cy="60" r="38" />
            <circle class="center-dot" cx="60" cy="60" r="3" />
          </svg>
        </div>
        <div class="lock-label">TARGET LOCKED</div>

        <div class="side-panel left">
          <div class="stat-block">
            <div class="stat-label">Altitude</div>
            <div class="stat-value">4,210 m</div>
            <div class="mini-bar">
              <div class="mini-bar-fill" style="width: 70%"></div>
            </div>
          </div>
          <div class="stat-block">
            <div class="stat-label">Velocity</div>
            <div class="stat-value">812 km/h</div>
            <div class="mini-bar">
              <div class="mini-bar-fill" style="width: 55%"></div>
            </div>
          </div>
          <div class="stat-block">
            <div class="stat-label">Integrity</div>
            <div class="stat-value">92%</div>
            <div class="mini-bar">
              <div class="mini-bar-fill" style="width: 92%"></div>
            </div>
          </div>
        </div>

        <div class="side-panel right">
          <div class="stat-block">
            <div class="stat-label">Power</div>
            <div class="stat-value">88%</div>
            <div class="mini-bar">
              <div class="mini-bar-fill" style="width: 88%"></div>
            </div>
          </div>
          <div class="stat-block">
            <div class="stat-label">Comms</div>
            <div class="stat-value">Stable</div>
            <div class="mini-bar">
              <div class="mini-bar-fill" style="width: 100%"></div>
            </div>
          </div>
          <div class="stat-block">
            <div class="stat-label">Threat</div>
            <div class="stat-value">Low</div>
            <div class="mini-bar">
              <div class="mini-bar-fill" style="width: 20%"></div>
            </div>
          </div>
        </div>

        <div class="bottom-strip">
          <div class="coord">
            LAT <span id="lat">35.6812</span> / LON
            <span id="lon">139.7671</span>
          </div>
          <div class="coord">SYS STATUS: <span>NOMINAL</span></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
