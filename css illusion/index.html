<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnetic Hover Card — Pure CSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage">
      <div class="magnet-card">
        <div class="field-ring"></div>
        <div class="field-ring ring-2"></div>
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24">
            <path d="M6 20V10a6 6 0 0 1 12 0v10" />
            <path d="M6 15H2M22 15h-4" />
            <path d="M6 20H2M22 20h-4" />
          </svg>
        </div>
        <h3>Magnetic Pull</h3>
        <p>
          Hover to feel the card lift and drift toward you -- a pure CSS
          illusion built with layered transforms, no JavaScript involved.
        </p>
      </div>
    </div>
  </body>
</html>
