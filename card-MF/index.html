<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HUD Interface Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hub-card">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scanline"></div>
      <div class="hub-header">
        <div class="hub-title">UNIT <span> // STATUS </span></div>
        <div class="status-dot"></div>
      </div>
      <div class="hub-id">
        <span>ID:XR-7749</span>
        <span class="blink"> ● Live</span>
      </div>
      <div class="stat-row">
        <div class="stat-label"><span>Power Core</span> <b>88%</b></div>
        <div class="bar-track">
          <div class="bar-fill power"></div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-label"><span>Shield Strength</span> <b>64%</b></div>
        <div class="bar-track">
          <div class="bar-fill shield"></div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat-label"><span>Data Syne</span> <b>97%</b></div>
        <div class="bar-track">
          <div class="bar-fill syne"></div>
        </div>
      </div>
      <div class="hub-footer">
        <div class="coords">
          LAT <b>35.914N</b> <br />
          LNG <b>74.308E</b>
        </div>
        <div class="radar"></div>
      </div>
    </div>
  </body>
</html>
