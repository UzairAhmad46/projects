<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snow Globe — CSS + JS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <div class="globe">
        <div class="sky"></div>
        <div class="moon"></div>
        <div class="ground"></div>

        <div class="cabin"></div>

        <div class="tree">
          <div class="layer"></div>
          <div class="layer"></div>
          <div class="layer"></div>
          <div class="trunk"></div>
        </div>

        <div class="snow-cap"></div>
        <div class="snow-field" id="snowField"></div>
      </div>

      <div class="base">
        <div class="base-label">Winter</div>
      </div>

      <div class="caption">Snow Globe — CSS + JS</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
