<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Theme Switcher    </title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>


     <div class="container">
      <div class="card">
        <h1>Dynamic Theme Switcher</h1>
        <p>Instantly switch between light and dark themes with a single click!</p>
        <div class="buttons">
          <button id="modeBtn">🌙 Dark Mode</button>
        </div>
        <h3>Choose Accent Color</h3>
        <div class="colors">
          <span class="color active" data-color="#6366f1" style="background-color: #6366f1;"></span>
          <span class="color" data-color="#ff4d6d" style="background-color: #ff4d6d;"></span>
           <span class="color" data-color="#22c55e" style="background-color: #22c55e;"></span>
            <span class="color" data-color="#06b6d4" style="background-color: #06b6d4;"></span>
             <span class="color" data-color="#f59e0b" style="background-color: #f59e0b;"></span>
              <span class="color" data-color="#8b5cf6" style="background-color: #8b5cf6;"></span>

        </div>
      </div>

     </div>
    <script src="script.js"></script>
  </body>
</html>
