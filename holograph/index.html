<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hologram Tech Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <div class="stage">
        <div class="card" id="card">
          <div class="holo-lines"></div>
          <div class="holo"></div>
          <div class="content">
            <div class="chip"></div>
            <span class="badge">Access · Level 04 </span>
            <div class="title-block">
              <div class="eyebrow">Uzair WebCraft</div>
              <h1>
                Hologram <br />
                Tech Card
              </h1>
              <p class="desc">
                Pure CSS holographic surface with real-time mouse-reactive
                shimmer and 3D tilt depth.
              </p>
            </div>
            <div class="divider"></div>
            <div class="footer">
              <div class="id-number">ID · <span>WC-2026</span></div>
              <div class="signal"><i></i><i></i><i></i><i></i></div>
            </div>
          </div>
        </div>
      </div>
      <p class="hint">move your cursor over the card</p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
