<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glass Counter UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="counter-card">
      <div class="label">Live Count</div>
      <div class="count-display" id="count">0</div>
      <div class="controls">
        <button class="btn minus" id="decrement">-</button>
        <button class="btn reset" id="reset">Reset</button>
        <button class="btn plus" id="increment">+</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
