<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Stroke Effect | Uzair WebCraft</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Space+Grotesk:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <span class="label">Basic Stroke</span>
        <span class="stroke-text basic"> STROKE</span>
      </div>
      <div class="row">
        <span class="label">Glow Cyan</span>
        <span class="stroke-text glow">Glow </span>
      </div>
      <div class="row">
        <span class="label">Ghost</span>
        <span class="stroke-text ghost"> GHOST</span>
      </div>
      <div class="row">
        <span class="label">RBB</span>
        <span class="stroke-text rgb"> RGB</span>
      </div>
      <div class="row">
        <span class="label">Offset</span>
        <span class="stroke-text offset"> OFFSET</span>
      </div>
    </div>
    <p class="hint">CSS -Webkit-text-stroke-- No javascript</p>
  </body>
</html>
