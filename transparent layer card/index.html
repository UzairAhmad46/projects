<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Transparent Layer Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stack">
      <div class="layer layer--3"></div>
      <div class="layer layer--2"></div>
      <div class="card">
        <div class="badge">Glass UI</div>
        <div class="icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 7l9-4 9 4-9 4-9-4z"></path>
            <path d="M3 12l9 4 9-4"></path>
            <path d="M3 17l9 4 9-4"></path>
          </svg>
        </div>
        <h2>Transparent Layer Card</h2>
        <p>
          A stacked glassmorphism card with layered depth, blur, and a hover
          sheen sweep — pure CSS.
        </p>
        <div class="footer-row">
          <div class="price">$0 <span>/ pure CSS</span></div>
          <button class="btn">Explore</button>
        </div>
      </div>
    </div>

    <div class="credit">Uzair WebCraft</div>
  </body>
</html>
