<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Organic Shape Morphing Card — Interactive</title>

        <h1>Organic Shape <span>Morphing</span></h1>
        <p>
          Move Your cursur over thr card -- the blobs drift toward it. One mouse

        <button class="btn">
          View Code

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-lincap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14M13 6l6 6-6 6" />
