<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Luxury Watch Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card" id="card">
      <span class="badge">✦ Limited Edition</span>
      <div class="watch-stage">
        <div class="glow"></div>
        <div class="watch">
          <div class="bezel">
            <div class="face" id="face">
              <div class="hand hour"></div>
              <div class="hand min"></div>
              <div class="hand sec"></div>
              <div class="pin"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="info">
        <h2>Chronos Aurum</h2>
        <p class="tag">Automatic Skeleton --41mm Rose Gold</p>
        <div class="specs">
          <div class="spec">Movement <span>Automatic</span></div>
          <div class="spec">Case <span>316L Steel</span></div>
          <div class="spec">Water Resist <span>100M</span></div>
          <div class="spec">Strap <span>Italian Leather</span></div>
        </div>
        <div class="footer">
          <div class="price">$4,280 <small>or 12x $356</small></div>
          <button class="btn">Add Cart</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
