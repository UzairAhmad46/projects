<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glassmorphism Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-blur blur1"></div>
    <div class="bg-blur blur2"></div>
    <div class="glass-card">
      <div class="card-header">
        <div class="avatar">UW</div>
        <div>
          <h2>Uziar WebCraft</h2>
          <p>Frontend Developer</p>
        </div>
      </div>
      <div class="card-content">
        <p>
          Creacting modern UI/UX experiences using HTML CSS AND JAVASCRIPT AND
          REACT.JS
        </p>
      </div>
      <div class="stats">
        <div>
          <h3>50+</h3>
          <span>Projects</span>
        </div>
        <div>
          <h3>100+</h3>
          <span>Clients</span>
        </div>
        <div>
          <h3>2+</h3>
          <span>Years</span>
        </div>
      </div>
      <button class="btn">View Profile</button>
    </div>
  </body>
</html>
