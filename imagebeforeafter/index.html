<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Before/After Slider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Before / After Slider</h1>
    <p class="sub">
      Drag the handle or tap anywhere on the image — pure CSS + JS, no
      libraries.
    </p>

    <div class="slider-wrap" id="sliderWrap">
      <img class="img-after" src="./images/image11.jpeg" alt="After" />
      <div class="img-before-wrap" id="beforeWrap">
        <img src="./images//image1.jpeg" alt="Before" />
      </div>
      <div class="divider" id="divider"></div>
      <div class="handle" id="handle"></div>
      <span class="label label-before">Before</span>
      <span class="label label-after">After</span>
    </div>
    <footer>Uzair WebCraft -- <span>#CSS + JS builds</span></footer>
    <script src="script.js"></script>
  </body>
</html>
