<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Animated Toggle Switch | Uzair WebCraft</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1>Animated Toggle Switch</h1>

      <label class="switch">
        <input type="checkbox" id="toggle" onchange="updateStatus()" />
        <span class="slider"></span>
      </label>

      <div class="status">STATE: <span id="statusText">OFF</span></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
